# The status page's only workflow. Copy it to .github/workflows/status.yml in the repository that hosts the page
# (a public repository, so Actions minutes and GitHub Pages are free and the checks run outside Cloudflare).
#
# Every five minutes it checks each component, commits the updated history, rebuilds the page and publishes it to
# GitHub Pages. A push to main (a new incident file, a design change) rebuilds and publishes without checking.
# GitHub may run scheduled workflows a few minutes late; the history counts checks, so a late run loses nothing.
#
# Alerts: when a component that was up is found down, the run opens an issue in this repository (GitHub emails its
# watchers, the owner included), publishes the page, and then fails on purpose. Only the change does this: while the
# component stays down, later runs pass and the page shows the outage. When everything is back, the issue is closed.
#
# Fallback: GitHub does not promise that a schedule runs, and a new repository's may not start for hours. So each
# check finishes by looking for a scheduled run in the last 20 minutes; finding none, it waits and starts the next
# check itself. Once the schedule is running the chain stops by itself. If both stop, the page says its checks are
# delayed.
name: Status
on:
  schedule:
    # Off the round minutes, when GitHub's scheduler is busiest and drops the most runs.
    - cron: '3-59/5 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write # outage issues
  actions: write # the fallback starts the next run

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One at a time, never cancelled: two jobs committing the history at once would conflict. On this job, not the
    # workflow, so the fallback's wait below does not hold up a push that publishes an incident.
    concurrency:
      group: status
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        if: github.event_name == 'push'
        run: node --test "test/*.test.js"
      - name: Check every component
        id: check
        if: github.event_name != 'push'
        run: node scripts/check.js
      - name: Commit the history
        if: github.event_name != 'push'
        run: |
          git config user.name "surlos-status"
          git config user.email "status@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "status: check $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - name: Build the page
        run: node scripts/build.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Open an issue for a new outage
        if: steps.check.outputs.down != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DOWN: ${{ steps.check.outputs.down }}
        run: |
          gh label create outage --repo "$GITHUB_REPOSITORY" --color B01F2C --description "A component failed its checks" --force
          gh issue create --repo "$GITHUB_REPOSITORY" --label outage --title "Down: $DOWN" \
            --body "$DOWN failed its checks at $(date -u +'%Y-%m-%d %H:%M UTC'). See https://status.surlos.com and this run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Note a recovery
        if: steps.check.outputs.recovered != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERED: ${{ steps.check.outputs.recovered }}
          STILL_DOWN: ${{ steps.check.outputs.still_down }}
        run: |
          echo "::notice title=Recovered::$RECOVERED"
          for issue in $(gh issue list --repo "$GITHUB_REPOSITORY" --label outage --state open --json number -q '.[].number'); do
            if [ -z "$STILL_DOWN" ]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Recovered: $RECOVERED. Every check is passing again as of $(date -u +'%Y-%m-%d %H:%M UTC')."
            else
              gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Recovered: $RECOVERED. Still down: $STILL_DOWN."
            fi
          done
      # Last, so the page is already published when the run fails.
      - name: Alert when something went down
        if: steps.check.outputs.down != ''
        env:
          DOWN: ${{ steps.check.outputs.down }}
        run: |
          echo "::error title=Surlos is down::$DOWN failed its checks. See https://status.surlos.com"
          exit 1

  # The fallback. Its own job, so it runs whether or not the check above failed its run to raise an alert.
  continue:
    needs: status
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Has the schedule run lately?
        id: schedule
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow status.yml --event schedule --limit 1 --json createdAt -q '.[0].createdAt // empty')
          age=$(( $(date -u +%s) - $( [ -n "$last" ] && date -u -d "$last" +%s || echo 0 ) ))
          echo "Last scheduled run: ${last:-never}"
          if [ "$age" -gt 1200 ]; then echo "stalled=true" >> "$GITHUB_OUTPUT"; fi
      - name: Wait, then start the next check
        if: steps.schedule.outputs.stalled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 240
          gh workflow run status.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
